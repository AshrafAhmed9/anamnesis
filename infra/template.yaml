AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Anamnesis — agentic memory on CockroachDB, deployed on AWS.
  Chat API (Lambda function URL), scheduled consolidation (EventBridge),
  scheduled ops introspection (ccloud), and an S3 bucket for reports.

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: CockroachDB connection string (cockroachdb+psycopg://...)
  BedrockRegion:
    Type: String
    Default: us-east-1
  CockroachClusterId:
    Type: String
    Default: ""
    Description: Optional — enables the ccloud ops sub-agent if set
  MockLlm:
    Type: String
    Default: "1"
    AllowedValues: ["0", "1"]
    Description: >
      "1" (default) runs anamnesis/agent/bedrock.py's deterministic mock
      instead of calling Bedrock — set to "0" once real InvokeModel access
      is granted on this AWS account (Bedrock currently returns
      "Operation not allowed" pending account history / use-case
      approval; the mock path is the same honestly-documented fallback
      already used in tests/CI, not a hidden workaround). All memory
      writes, transactions, retries, and the CockroachDB integration are
      fully real either way — only the embedding/chat calls are mocked.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        # DATABASE_URL itself is intentionally NOT set here — see
        # DatabaseSecret below. Every function instead gets
        # DATABASE_SECRET_ARN and resolves the real connection string from
        # Secrets Manager at cold start (anamnesis/db/engine.py), so the
        # credential is never stored as a plaintext Lambda environment
        # variable (visible to anyone with lambda:GetFunctionConfiguration)
        # or in CloudFormation parameter/console history.
        DATABASE_SECRET_ARN: !Ref DatabaseSecret
        # AWS_REGION is a Lambda-reserved env var (auto-populated by the
        # runtime) and cannot be set in the function config — Lambda
        # rejects deployment if you try. anamnesis/agent/bedrock.py and
        # anamnesis/db/engine.py already read os.environ["AWS_REGION"],
        # which Lambda provides for free, so BedrockRegion only matters
        # for non-Lambda (local/CLI) use via DATABASE_URL-style env setup.
        ANAMNESIS_REPORT_BUCKET: !Ref ReportsBucket
        COCKROACH_CLUSTER_ID: !Ref CockroachClusterId
        ANAMNESIS_MOCK_LLM: !Ref MockLlm

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "anamnesis/${AWS::StackName}/database-url"
      Description: CockroachDB connection string, seeded from the DatabaseUrl deploy parameter
      SecretString: !Ref DatabaseUrl

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "anamnesis-reports-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ChatApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: app.lambda_handlers.api.handler
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: ["*"]
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecret

  ConsolidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: app.lambda_handlers.consolidate.handler
      Timeout: 60
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ReportsBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecret
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(30 minutes)
            Description: Periodic memory consolidation + salience decay sweep

  OpsAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: app.lambda_handlers.ops_agent.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecret
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: ccloud CLI self-observation of the memory cluster's own health

Outputs:
  ChatApiUrl:
    Description: Public function URL for the chat API
    Value: !GetAtt ChatApiFunctionUrl.FunctionUrl
  ReportsBucketName:
    Value: !Ref ReportsBucket
